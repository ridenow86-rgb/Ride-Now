<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Create Password - Ride Now</title>

    <link
        rel="stylesheet"
        href="owner-password.css"
    >

</head>


<body>

    <div class="page">


        <!-- Progress Steps -->

        <div class="progress-container">

    <div class="step completed">
        <div class="step-number">✓</div>
        <span>Owner Details</span>
    </div>

    <div class="line completed-line"></div>


    <div class="step completed">
        <div class="step-number">✓</div>
        <span>Profile Photo</span>
    </div>

    <div class="line completed-line"></div>


    <div class="step completed">
        <div class="step-number">✓</div>
        <span>Documents</span>
    </div>

    <div class="line completed-line"></div>


    <div class="step completed">
        <div class="step-number">✓</div>
        <span>Vehicle Details</span>
    </div>

    <div class="line completed-line"></div>


    <div class="step active">
        <div class="step-number">5</div>
        <span>Password</span>
    </div>

    <div class="line"></div>


    <div class="step">
        <div class="step-number">6</div>
        <span>Complete</span>
    </div>

</div>



        <!-- Main Card -->

        <div class="password-card">

            <div class="icon-circle">
                🔐
            </div>

            <h1>Create Your Password</h1>

            <p class="subtitle">
                Create a secure password for your Ride Now owner account.
            </p>



            <!-- Password -->

            <div class="form-group">

                <label for="ownerPassword">
                    Create Password
                </label>

                <div class="password-wrapper">

                    <input
                        type="password"
                        id="ownerPassword"
                        placeholder="Enter your password"
                    >

                    <button
                        type="button"
                        class="show-password"
                        onclick="togglePassword('ownerPassword', this)"
                    >
                        👁
                    </button>

                </div>

            </div>



            <!-- Password Rules -->

            <div class="password-rules">

                <p id="ruleLength">
                    ○ At least 6 characters
                </p>

                <p id="ruleLetter">
                    ○ At least one letter
                </p>

                <p id="ruleNumber">
                    ○ At least one number
                </p>

            </div>



            <!-- Confirm Password -->

            <div class="form-group">

                <label for="confirmPassword">
                    Confirm Password
                </label>

                <div class="password-wrapper">

                    <input
                        type="password"
                        id="confirmPassword"
                        placeholder="Re-enter your password"
                    >

                    <button
                        type="button"
                        class="show-password"
                        onclick="togglePassword('confirmPassword', this)"
                    >
                        👁
                    </button>

                </div>

            </div>


            <p
                id="passwordError"
                class="password-error"
            ></p>



            <!-- Buttons -->

            <div class="button-container">

                <button
                    type="button"
                    class="back-button"
                    onclick="goBack()"
                >
                    ← Back
                </button>

                <button
                    type="button"
                    class="next-button"
                    onclick="createOwnerAccount()"
                >
                    Create Account
                </button>

            </div>

        </div>

    </div>



    <script>


        /* =========================================
           SHOW / HIDE PASSWORD
           ========================================= */

        function togglePassword(inputId, button) {

            const input =
                document.getElementById(inputId);

            if (input.type === "password") {

                input.type = "text";

                button.textContent = "🙈";

            }

            else {

                input.type = "password";

                button.textContent = "👁";

            }

        }



        /* =========================================
           PASSWORD VALIDATION
           ========================================= */

        const ownerPassword =
            document.getElementById("ownerPassword");


        ownerPassword.addEventListener(
            "input",
            function () {

                const password =
                    ownerPassword.value;


                updateRule(
                    "ruleLength",
                    password.length >= 6
                );


                updateRule(
                    "ruleLetter",
                    /[A-Za-z]/.test(password)
                );


                updateRule(
                    "ruleNumber",
                    /[0-9]/.test(password)
                );

            }
        );



        function updateRule(elementId, valid) {

            const element =
                document.getElementById(elementId);


            if (valid) {

                element.textContent =
                    "✓ " +
                    element.textContent.substring(2);

                element.classList.add("valid");

            }

            else {

                element.textContent =
                    "○ " +
                    element.textContent.substring(2);

                element.classList.remove("valid");

            }

        }



        /* =========================================
           CREATE OWNER ACCOUNT
           ========================================= */

        async function createOwnerAccount() {

            const password =
                document
                    .getElementById("ownerPassword")
                    .value
                    .trim();


            const confirmPassword =
                document
                    .getElementById("confirmPassword")
                    .value
                    .trim();


            const error =
                document.getElementById("passwordError");


            error.textContent = "";



            /* -------------------------------------
               PASSWORD VALIDATION
               ------------------------------------- */

            if (password.length < 6) {

                error.textContent =
                    "Password must contain at least 6 characters.";

                return;

            }


            if (!/[A-Za-z]/.test(password)) {

                error.textContent =
                    "Password must contain at least one letter.";

                return;

            }


            if (!/[0-9]/.test(password)) {

                error.textContent =
                    "Password must contain at least one number.";

                return;

            }


            if (password !== confirmPassword) {

                error.textContent =
                    "Passwords do not match.";

                return;

            }



            /* -------------------------------------
               GET OWNER DETAILS
               ------------------------------------- */

            let ownerDetails = {};

            try {

                ownerDetails =
                    JSON.parse(
                        localStorage.getItem(
                            "rideNowOwnerDetails"
                        ) || "{}"
                    );

            }

            catch (e) {

                error.textContent =
                    "Unable to read owner details.";

                return;

            }



            if (
                !ownerDetails.name ||
                !ownerDetails.phone ||
                !ownerDetails.email
            ) {

                error.textContent =
                    "Owner details are missing. Please go back.";

                return;

            }



            /* -------------------------------------
               GET PROFILE PHOTO
               ------------------------------------- */

            const profilePhoto =
                localStorage.getItem(
                    "rideNowOwnerProfilePhoto"
                ) || "";



            /* -------------------------------------
               GET VEHICLE DETAILS
               ------------------------------------- */

            let vehicle = {};

            try {

                vehicle =
                    JSON.parse(
                        localStorage.getItem(
                            "rideNowOwnerVehicle"
                        ) || "{}"
                    );

            }

            catch (e) {

                vehicle = {};

            }



            /* -------------------------------------
               GET VEHICLE PHOTOS
               ------------------------------------- */

            let vehiclePhotos = null;

            try {

                const storedPhotos =
                    localStorage.getItem(
                        "rideNowOwnerVehiclePhotos"
                    );

                if (storedPhotos) {

                    vehiclePhotos =
                        JSON.parse(storedPhotos);

                }

            }

            catch (e) {

                console.log(
                    "Vehicle photo data could not be read."
                );

            }



            /* -------------------------------------
               MOVE VEHICLE PHOTOS TO INDEXED DB
               ------------------------------------- */

            if (vehiclePhotos && vehiclePhotos.length > 0) {

                try {

                    await saveVehiclePhotosToIndexedDB(
                        vehiclePhotos
                    );


                    /*
                     * Only remove the large
                     * localStorage data AFTER
                     * IndexedDB successfully
                     * stores the photos.
                     */

                    localStorage.removeItem(
                        "rideNowOwnerVehiclePhotos"
                    );

                }

                catch (photoError) {

                    console.error(
                        "Photo storage error:",
                        photoError
                    );

                    error.textContent =
                        "Unable to save vehicle photos. Please try again.";

                    return;

                }

            }

            /* ======= CORRECTED OWNERACCOUNT ========*/

const ownerAccount = {

    name:
        ownerDetails.name,

    phone:
        ownerDetails.phone,

    email:
        ownerDetails.email,

    address:
        ownerDetails.address || "",

    profilePhoto:
        profilePhoto,

    documents:
        JSON.parse(
            localStorage.getItem(
                "rideNowOwnerDocuments"
            ) || "{}"
        ),

    vehicle:
        vehicle,

    vehiclePhotos:
        vehiclePhotos || [],

    password:
        password

};



            /* -------------------------------------
               REMOVE OLD OWNER ACCOUNT
               ------------------------------------- */

            /*
             * An old account may contain huge
             * Base64 images.
             *
             * Remove only the OLD account.
             *
             * This does NOT remove:
             * - owner details
             * - profile photo
             * - vehicle details
             * - vehicle photos
             */

            localStorage.removeItem(
                "rideNowOwnerAccount"
            );



            /* -------------------------------------
               SAVE NEW OWNER ACCOUNT
               ------------------------------------- */

            try {

                localStorage.setItem(
                    "rideNowOwnerAccount",
                    JSON.stringify(ownerAccount)
                );

            }

            catch (saveError) {

                console.error(
                    "Account save error:",
                    saveError
                );

                error.textContent =
                    "Unable to save owner account. Please try again.";

                return;

            }



            /* -------------------------------------
               SUCCESS
               ------------------------------------- */

            window.location.href =
                "owner-success.html";

        }



        /* =========================================
           SAVE VEHICLE PHOTOS TO INDEXED DB
           ========================================= */

       function saveVehiclePhotosToIndexedDB(photos) {

    return new Promise(
        function(resolve, reject) {

            const request =
                indexedDB.open(
                    "RideNowDatabase"
                );


            request.onupgradeneeded =
                function(event) {

                    const db =
                        event.target.result;

                    if (
                        !db.objectStoreNames.contains(
                            "vehiclePhotos"
                        )
                    ) {

                        db.createObjectStore(
                            "vehiclePhotos"
                        );

                    }

                };


            request.onsuccess =
                function(event) {

                    const db =
                        event.target.result;


                    if (
                        !db.objectStoreNames.contains(
                            "vehiclePhotos"
                        )
                    ) {

                        db.close();

                        reject(
                            new Error(
                                "vehiclePhotos store not found."
                            )
                        );

                        return;

                    }


                    const transaction =
                        db.transaction(
                            "vehiclePhotos",
                            "readwrite"
                        );


                    const store =
                        transaction.objectStore(
                            "vehiclePhotos"
                        );


                    store.put(
                        photos,
                        "ownerVehiclePhotos"
                    );


                    transaction.oncomplete =
                        function() {

                            db.close();

                            resolve();

                        };


                    transaction.onerror =
                        function() {

                            db.close();

                            reject(
                                transaction.error
                            );

                        };


                    transaction.onabort =
                        function() {

                            db.close();

                            reject(
                                transaction.error ||
                                new Error(
                                    "IndexedDB transaction aborted."
                                )
                            );

                        };

                };


            request.onerror =
                function() {

                    reject(
                        request.error
                    );

                };

        }
    );

}



        /* =========================================
           BACK BUTTON
           ========================================= */

        function goBack() {

            window.location.href =
                "owner-vehicle-details.html";

        }

    </script>

</body>

</html>
