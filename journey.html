<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Ride Now - Choose Your Journey</title>

    <link rel="stylesheet" href="journey.css">

</head>

<body>

    <!-- Main Page -->

    <div class="journey-page">


        <!-- Logo -->

        <div class="logo">

            <img src="ride_now_logo.jpeg" alt="Ride Now Logo">

        </div>


        <!-- Heading -->

        <div class="heading">

            <h1>Choose Your Journey</h1>

            <p>
                Tell us how you want to use Ride Now
            </p>

        </div>


        <!-- Choice Cards -->

        <div class="choices">


            <!-- Rent a Vehicle -->

            <div class="choice-card">

                <div class="choice-icon">
                    <img src="car or bike want.jpeg">
                </div>

                <h2>Rent a Car or Bike</h2>

                <p>
                    Looking for a car or bike?
                    Find the perfect ride for your journey.
                </p>

                <button onclick="window.location.href='renter.html'">
                    Rent a Vehicle
                </button>

            </div>


            <!-- Give Vehicle on Rent -->

            <div class="choice-card">

                <div class="choice-icon">
                    <img src="list your vehicles.png">
                </div>

                <h2>List Your Vehicle</h2>

                <p>
                    Have a car or bike?
                    List it on Ride Now and earn from your vehicle.
                </p>

                <button onclick="window.location.href='owner-details.html'">
                    List My Vehicle
                </button>

            </div>


        </div>


        <!-- Bottom Text -->

        <p class="bottom-text">
            Choose an option to continue
        </p>


    </div>

</body>

</html>
