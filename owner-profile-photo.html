<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Ride Now - Profile Photo</title>

    <link rel="stylesheet"
          href="owner-profile-photo.css">

</head>

<body>

    <div class="page">

        <!-- Back -->

        <button class="back-button"
                onclick="goBack()">

            ← Back

        </button>


        <!-- Progress -->

        <div class="progress-container">

            <div class="progress-line"></div>

            <div class="progress-line-active"></div>


            <!-- Step 1 -->

            <div class="step completed">

                <div class="step-circle">
                    ✓
                </div>

                <div class="step-text">
                    Owner Details
                </div>

            </div>


            <!-- Step 2 -->

            <div class="step active">

                <div class="step-circle">
                    2
                </div>

                <div class="step-text">
                    Profile Photo
                </div>

            </div>


            <!-- Step 3 -->

            <div class="step">

                <div class="step-circle">
                    3
                </div>

                <div class="step-text">
                    Vehicle Details
                </div>

            </div>


            <!-- Step 4 -->

            <div class="step">

                <div class="step-circle">
                    4
                </div>

                <div class="step-text">
                    Password
                </div>

            </div>


            <!-- Step 5 -->

            <div class="step">

                <div class="step-circle">
                    5
                </div>

                <div class="step-text">
                    Complete
                </div>

            </div>

        </div>


        <!-- Profile Photo Card -->

        <div class="form-card">

            <h1>
                Add Your Profile Photo
            </h1>

            <p class="subtitle">
                Add a clear photo so renters can recognize you
            </p>


            <!-- Photo Upload -->

            <div class="photo-section">

                <div class="photo-preview"
                     id="photoPreview">

                    <span id="photoIcon">
                        👤
                    </span>

                    <img id="previewImage"
                         alt="Profile Preview">

                </div>


                <label for="profilePhoto"
                       class="upload-button">

                    Choose Photo

                </label>

                <input
                    type="file"
                    id="profilePhoto"
                    accept="image/jpeg,image/png,image/jpg"
                >

                <p class="photo-info">
                    JPG, JPEG or PNG • Maximum 5 MB
                </p>

                <p id="errorMessage"
                   class="error-message">
                </p>

            </div>


            <!-- Buttons -->

            <div class="button-row">

                <button
                    type="button"
                    class="back-form-button"
                    onclick="goBack()">

                    Back

                </button>


                <button
                    type="button"
                    class="next-button"
                    id="nextButton">

                    Next

                </button>

            </div>

        </div>

    </div>


    <script>

        /* Back */

function goBack() {

    window.location.href =
        "owner-details.html";

}


        /* Elements */

        const profilePhoto =
            document.getElementById("profilePhoto");

        const previewImage =
            document.getElementById("previewImage");

        const photoIcon =
            document.getElementById("photoIcon");

        const photoPreview =
            document.getElementById("photoPreview");

        const errorMessage =
            document.getElementById("errorMessage");

        let selectedPhoto = null;


        /* Select photo */

        profilePhoto.addEventListener(
            "change",
            function() {

                errorMessage.style.display =
                    "none";

                const file =
                    this.files[0];


                if (!file) {

                    return;

                }


                /* Check file type */

                const allowedTypes = [
                    "image/jpeg",
                    "image/jpg",
                    "image/png"
                ];


                if (!allowedTypes.includes(file.type)) {

                    errorMessage.textContent =
                        "Please select a JPG, JPEG or PNG image.";

                    errorMessage.style.display =
                        "block";

                    this.value = "";

                    return;

                }


                /* Check file size */

                if (file.size > 5 * 1024 * 1024) {

                    errorMessage.textContent =
                        "Photo size must be less than 5 MB.";

                    errorMessage.style.display =
                        "block";

                    this.value = "";

                    return;

                }


                selectedPhoto = file;


                /* Preview */

                const reader =
                    new FileReader();


                reader.onload =
                    function(event) {

                        previewImage.src =
                            event.target.result;

                        previewImage.style.display =
                            "block";

                        photoIcon.style.display =
                            "none";

                        photoPreview.classList.add(
                            "has-photo"
                        );

                    };


                reader.readAsDataURL(file);

            }
        );


        /* Next */

        document
            .getElementById("nextButton")
            .addEventListener(
                "click",
                function() {

                    if (!selectedPhoto) {

                        errorMessage.textContent =
                            "Please upload your profile photo.";

                        errorMessage.style.display =
                            "block";

                        return;

                    }


                    /*
                       Save photo as Base64
                       so it can be shown later
                       on owner Home/Profile.
                    */

                    const reader =
                        new FileReader();


                    reader.onload =
                        function(event) {

                            localStorage.setItem(
                                "rideNowOwnerProfilePhoto",
                                event.target.result
                            );


                            /* Go to Documents */
                            window.location.href = 
                            "owner-documents.html";

                        };


                    reader.readAsDataURL(selectedPhoto);

                }
            );

    </script>

</body>

</html>
